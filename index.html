<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RankedPlus — Live Dashboard</title>
  <style>
    :root {
      --bg: #0b0f14; --panel: #121820; --border: #1e2a38; --text: #e6edf3;
      --muted: #8b9cb3; --accent: #3b82f6; --accent-hover: #2563eb;
      --success: #22c55e; --danger: #ef4444; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; }
    header { background: #0f172a; border-bottom: 1px solid var(--border); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header input { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.75rem; border-radius: 8px; width: 220px; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; display: grid; gap: 1.5rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; font-weight: 500; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.85rem; border-radius: 8px; margin-bottom: 0.9rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    .result { margin-top: 1rem; padding: 1rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; display: none; }
    .result.show { display: block; }
    .result.error { border-color: var(--danger); color: #fca5a5; }
    .result.success { border-color: var(--success); }
    .samples { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .samples button { font-size: 0.75rem; padding: 0.35rem 0.7rem; background: var(--border); color: var(--text); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .grid-2, .row { grid-template-columns: 1fr; } }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>RankedPlus Dashboard</h1>
    <div>
      <label for="apiBase" style="display:inline; margin-right:0.5rem">API Base</label>
      <input type="text" id="apiBase" placeholder="http://localhost:8080" />
    </div>
  </header>

  <main>
    <!-- Player Context -->
    <section class="card">
      <h2>👤 Player Context</h2>
      <div class="samples" id="samplePlayers"></div>
      <div class="row">
        <div>
          <label for="playerUuid">Player UUID</label>
          <input id="playerUuid" type="text" placeholder="11111111-1111-1111-1111-111111111111" />
        </div>
        <div>
          <label for="ladder">Ladder</label>
          <input id="ladder" type="text" value="duels" />
        </div>
      </div>
      <button id="btnLookup">Lookup Player</button>
      <div id="contextResult" class="result"></div>
    </section>

    <div class="grid-2">
      <!-- Create Matchd -->
      <section class="card">
        <h2>⚔️ Create Match</h2>
        <label for="cLadder">Ladder</label>
        <input id="cLadder" type="text" value="duels" />
        <div class="row">
          <div><label for="playerA">Player A UUID</label><input id="playerA" type="text" /></div>
          <div><label for="playerAIgn">Player A IGN</label><input id="playerAIgn" type="text" /></div>
        </div>
        <div class="row">
          <div><label for="playerB">Player B UUID</label><input id="playerB" type="text" /></div>
          <div><label for="playerBIgn">Player B IGN</label><input id="playerBIgn" type="text" /></div>
        </div>
        <button id="btnCreate">Create Match</button>
        <div id="createResult" class="result"></div>
      </section>

      <!-- Resolve Match -->
      <section class="card">
        <h2>🏆 Resolve Match</h2>
        <label for="matchId">Match ID</label>
        <input id="matchId" type="number" placeholder="1" />
        <label for="winnerUuid">Winner UUID</label>
        <input id="winnerUuid" type="text" />
        <button id="btnResolve">Resolve Match</button>
        <div id="resolveResult" class="result"></div>
      </section>
    </div>
  </main>

  <footer><p>&copy; RankedPlus Live System Panel</p></footer>

  <script>
    function getApiBase() {
      const val = document.getElementById('apiBase').value.trim();
      return val ? val.replace(/\/$/, '') : 'http://localhost:8080';
    }

    function showResult(elementId, data, isError = false) {
      const el = document.getElementById(elementId);
      el.className = `result show ${isError ? 'error' : 'success'}`;
      el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    const samples = [
      { uuid: '11111111-1111-1111-1111-111111111111', ladder: 'duels', label: 'Sample 1' },
      { uuid: '22222222-2222-2222-2222-222222222222', ladder: 'skywars', label: 'Sample 2' }
    ];
    const container = document.getElementById('samplePlayers');
    samples.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.addEventListener('click', () => {
        document.getElementById('playerUuid').value = s.uuid;
        document.getElementById('ladder').value = s.ladder;
      });
      container.appendChild(btn);
    });

    document.getElementById('btnLookup').addEventListener('click', async () => {
      const uuid = document.getElementById('playerUuid').value.trim();
      const ladder = document.getElementById('ladder').value.trim();
      if (!uuid || !ladder) return alert('Enter Player UUID and Ladder.');
      try {
        const res = await fetch(`${getApiBase()}/player/${uuid}/${ladder}`);
        if (!res.ok) throw new Error(`Status: ${res.status}`);
        showResult('contextResult', await res.json());
      } catch (err) { showResult('contextResult', err.message, true); }
    });

    document.getElementById('btnCreate').addEventListener('click', async () => {
      const payload = {
        ladder: document.getElementById('cLadder').value.trim(),
        playerA: { uuid: document.getElementById('playerA').value.trim(), ign: document.getElementById('playerAIgn').value.trim() },
        playerB: { uuid: document.getElementById('playerB').value.trim(), ign: document.getElementById('playerBIgn').value.trim() }
      };
      if (!payload.ladder || !payload.playerA.uuid || !payload.playerB.uuid) return alert('Fill in Ladder and Player UUIDs.');
      try {
        const res = await fetch(`${getApiBase()}/match/create`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`Status: ${res.status}`);
        showResult('createResult', await res.json());
      } catch (err) { showResult('createResult', err.message, true); }
    });

    document.getElementById('btnResolve').addEventListener('click', async () => {
      const matchId = document.getElementById('matchId').value.trim();
      const winnerUuid = document.getElementById('winnerUuid').value.trim();
      if (!matchId || !winnerUuid) return alert('Fill in Match ID and Winner UUID.');
      try {
        const res = await fetch(`${getApiBase()}/match/resolve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ matchId: parseInt(matchId, 10), winnerUuid })
        });
        if (!res.ok) throw new Error(`Status: ${res.status}`);
        showResult('resolveResult', await res.json());
      } catch (err) { showResult('resolveResult', err.message, true); }
    });
  </script>
</body>
</html>
